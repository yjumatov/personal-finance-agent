<!DOCTYPE html>
<html>
<head>
    <title>Check API Response</title>
    <style>
        body { font-family: monospace; margin: 20px; background: #1e293b; color: #f1f5f9; }
        button { padding: 10px 20px; background: #6366f1; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .box { background: #0f172a; padding: 15px; margin: 20px 0; border-radius: 5px; max-height: 500px; overflow-y: auto; border: 2px solid #6366f1; }
        input { padding: 8px; width: 100%; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>🔍 Check What API Returns</h1>
    
    <h2>Add Test Expense</h2>
    <input type="date" id="date">
    <input type="number" id="amount" placeholder="Amount" value="50">
    <input type="text" id="desc" placeholder="Description" value="Test">
    <button onclick="addExp()">Add</button>
    
    <h2>Expenses</h2>
    <div id="list"></div>
    
    <button onclick="callAPI()" style="padding: 15px 30px; font-size: 16px; background: #ec4899;">Call API</button>
    
    <h2>Raw Response JSON</h2>
    <div id="response" class="box">Waiting...</div>
    
    <h2>Field Check</h2>
    <div id="fields" class="box">-</div>

    <script>
        let exps = [];
        document.getElementById('date').valueAsDate = new Date();
        
        function addExp() {
            exps.push({
                date: document.getElementById('date').value,
                amount: parseFloat(document.getElementById('amount').value),
                description: document.getElementById('desc').value
            });
            document.getElementById('list').innerHTML = exps.map(e => `<div>${e.date} - ${e.description} - $${e.amount}</div>`).join('');
        }
        
        async function callAPI() {
            try {
                const resp = await fetch('http://localhost:8000/run', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({query: 'test', financial_data: {expenses: exps}})
                });
                const data = await resp.json();
                
                document.getElementById('response').textContent = JSON.stringify(data, null, 2);
                
                // Check fields
                let fieldInfo = '';
                fieldInfo += `status: ${data.status}\n`;
                fieldInfo += `analysis: ${data.analysis ? 'EXISTS (' + data.analysis.length + ' chars)' : 'MISSING'}\n`;
                fieldInfo += `recommendations: ${data.recommendations ? 'EXISTS (' + data.recommendations.length + ' chars)' : 'MISSING'}\n`;
                fieldInfo += `budget: ${data.budget ? 'EXISTS (' + data.budget.length + ' chars)' : 'MISSING'}\n`;
                fieldInfo += `output: ${data.output ? 'EXISTS (' + data.output.length + ' chars)' : 'MISSING'}\n`;
                
                document.getElementById('fields').textContent = fieldInfo;
                
            } catch(e) {
                document.getElementById('response').textContent = 'ERROR: ' + e.message;
            }
        }
    </script>
</body>
</html>
